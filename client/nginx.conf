user nginx;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules/*.conf;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml application/xml;
  brotli on;
  brotli_comp_level 5;
  brotli_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml application/xml;

  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
      proxy_pass http://server:5000/api/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /index.html { add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
    location = /sw.js { add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache, must-revalidate" always; }
    location ^~ /assets/ { add_header Cache-Control "public, max-age=31536000, immutable" always; try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
  }
}
