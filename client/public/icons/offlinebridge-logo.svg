<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="arivuGradient" x1="10%" y1="88%" x2="88%" y2="12%">
      <stop offset="0%" stop-color="#4c1d95" />
      <stop offset="20%" stop-color="#6b21a8" />
      <stop offset="42%" stop-color="#3b82f6" />
      <stop offset="72%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>
  </defs>

  <!-- Clean rounded squircle card matching reference -->
  <rect x="3" y="3" width="94" height="94" rx="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Lotus Petals (Curved Line Art with Arivu Gradient) -->
  <g fill="none" stroke="url(#arivuGradient)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Central Vertical Petal -->
    <path d="M 50 76 C 41 62 41 44 50 30 C 59 44 59 62 50 76 Z" />

    <!-- Inner Left Petal -->
    <path d="M 50 76 C 36 68 28 54 34 38 C 43 48 48 64 50 76 Z" />

    <!-- Inner Right Petal -->
    <path d="M 50 76 C 64 68 72 54 66 38 C 57 48 52 64 50 76 Z" />

    <!-- Outer Left Petal -->
    <path d="M 50 76 C 30 76 15 65 19 51 C 28 54 38 64 50 76 Z" />

    <!-- Outer Right Petal -->
    <path d="M 50 76 C 70 76 85 65 81 51 C 72 54 62 64 50 76 Z" />

    <!-- Bottom Cradle Petals -->
    <path d="M 50 78 C 34 83 18 73 14 62 C 24 67 38 72 50 78 Z" />
    <path d="M 50 78 C 66 83 82 73 86 62 C 76 67 62 72 50 78 Z" />
  </g>

  <!-- Sparkles & Accent Dots (Purple to Cyan Gradient) -->
  <g fill="url(#arivuGradient)">
    <!-- Left 4-Point Star -->
    <path d="M 18 47 Q 18 51 14 51 Q 18 51 18 55 Q 18 51 22 51 Q 18 51 18 47 Z" />
    <!-- Left Dots -->
    <circle cx="24" cy="37" r="1.4" />
    <circle cx="35" cy="26" r="1.1" />

    <!-- Right 4-Point Star -->
    <path d="M 78 30 Q 78 34 74 34 Q 78 34 78 38 Q 78 34 82 34 Q 78 34 78 30 Z" />
    <!-- Right Dots -->
    <circle cx="88" cy="44" r="1.4" />
    <circle cx="74" cy="21" r="1.1" />
  </g>
</svg>
