services:
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: offlinebridge-client
    ports:
      - "5173:80"
    depends_on:
      - server

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: offlinebridge-server
    ports:
      - "5000:5000"